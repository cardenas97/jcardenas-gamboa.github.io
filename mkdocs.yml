site_name: Jorge Cardenas-Gamboa
site_url: https://sitename.example

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: deep purple
  font:
    text: Roboto Mono
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.sections
    - navigation.top

markdown_extensions:
  - toc:
      permalink: false

nav:
  - Home: index.md
  - Research: papers.md
  - CV: cv.pdf

extra_css:
  - stylesheets/extra.css